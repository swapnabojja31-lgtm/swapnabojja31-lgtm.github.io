<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swapna Bojja</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;padding:20px;font-family:system-ui;min-height:100vh}
.card{background:#fff;border-radius:22px;padding:24px 18px;text-align:center;max-width:360px;width:100%;height:fit-content}
.profile{width:130px;height:130px;border-radius:50%;border:4px solid #a855f7;object-fit:cover;margin:0 auto;display:block}
.tag{background:#f5f0ff;border:1px solid #e9d5ff;padding:5px 10px;border-radius:14px;font-size:12px;margin:3px;display:inline-block}
.btn{display:block;background:#a855f7;color:#fff;padding:12px;border-radius:20px;text-decoration:none;margin:10px 0;font-weight:700;cursor:pointer}
#ai-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#a855f7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:99}
#ai-box{position:fixed;bottom:85px;right:15px;width:300px;max-width:88vw;height:360px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;flex-direction:column;z-index:99;overflow:hidden}
#ai-head{background:#a855f7;color:#fff;padding:12px;font-weight:700;display:flex;justify-content:space-between}
#ai-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:#f9f5ff}
.m{padding:8px 11px;border-radius:12px;font-size:13px;max-width:82%}
.bot{background:#ede0ff;align-self:flex-start}
.usr{background:#a855f7;color:#fff;align-self:flex-end}
#ai-in{display:flex;padding:8px;border-top:1px solid #eee;gap:5px}
#ai-in input{flex:1;border:1px solid #ddd;border-radius:20px;padding:7px 12px;outline:none}
#ai-in button{background:#a855f7;color:#fff;border:none;border-radius:50%;width:34px;height:34px}
</style>
</head>
<body>
<div class="card">
<img class="profile" src="https://github.com/swapnabojja31-lgtm.png" alt="Swapna">
<h1>Hi, I'm Swapna Bojja 👋</h1>
<p style="color:#666">Web Developer | AI Enthusiast</p>
<p>Building beautiful websites & AI assistants!</p>
<div><span class="tag">HTML</span><span class="tag">CSS</span><span class="tag">JS</span><span class="tag">AI</span><span class="tag">Python</span></div>
<div class="btn" onclick="toggleAI()">🤖 Chat with my AI</div>
<a class="btn" style="background:#fff;color:#333;border:1px solid #ddd" href="mailto:swapna@email.com">Contact Me</a>
</div>

<div id="ai-btn" onclick="toggleAI()">🤖</div>
<div id="ai-box">
<div id="ai-head"><span>🤖 Swapna's AI</span><span onclick="toggleAI()" style="cursor:pointer">✕</span></div>
<div id="ai-msgs"><div class="m bot">Hi! I'm Swapna's AI! Ask me about her skills! 👋</div></div>
<div id="ai-in"><input id="q" placeholder="Ask something..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>

<script>
let o=false;
function toggleAI(){o=!o;document.getElementById('ai-box').style.display=o?'flex':'none';}
function send(){
let i=document.getElementById('q');let t=i.value.trim();if(!t)return;
let b=document.getElementById('ai-msgs');b.innerHTML+=`<div class="m usr">${t}</div>`;i.value='';
setTimeout(()=>{
let r="Swapna is awesome! 😊 ";
let l=t.toLowerCase();
if(l.includes('skill'))r="Swapna knows HTML, CSS, JavaScript, Python & AI! 💜";
else if(l.includes('project'))r="She builds portfolio sites & AI assistants like this!";
else if(l.includes('contact'))r="Email her via Contact button! 📧";
else if(l.includes('who'))r="Swapna Bojja - Web Developer from Telangana! 🌟";
else if(l.includes('ai'))r="This AI was built by Swapna! How cool! 🤖";
else r="Ask about skills, projects or contact! ✨";
b.innerHTML+=`<div class="m bot">${r}</div>`;b.scrollTop=b.scrollHeight;
},500);
b.scrollTop=b.scrollHeight;
}
</script>
</body>
</html>
